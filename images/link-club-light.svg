<svg xmlns="http://www.w3.org/2000/svg" width="168" height="24" viewBox="0 0 168 24">
  <style>
    @keyframes sweep { 0% { opacity: 0.35; } 25% { opacity: 1.0; } 50%, 100% { opacity: 0.35; } }
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.5px; fill: #0000FF; }
    .l { animation: sweep 6s ease-in-out 2s infinite; opacity: 0.35; }
    .s { opacity: 0.25; }
  </style>
  <text class="l" x="2" y="16">good internet club</text>
  <text class="s" x="158" y="16" text-anchor="middle">/</text>
</svg>
