<svg xmlns="http://www.w3.org/2000/svg" width="74" height="24" viewBox="0 0 74 24">
  <style>
    @keyframes sweep { 0% { opacity: 0.3; } 25% { opacity: 0.9; } 50%, 100% { opacity: 0.3; } }
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.5px; fill: #DEDED8; }
    .l { animation: sweep 6s ease-in-out 4s infinite; opacity: 0.3; }
    .s { opacity: 0.25; }
  </style>
  <text class="l" x="2" y="16">say hello</text>
  
</svg>
